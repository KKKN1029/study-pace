<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101117"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Study Pace"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Study Pace — 学習進捗</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#f5f5f8;background:#101117;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#2a3040 0%,#141620 48%,#101117 100%)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #9bbcff;outline-offset:2px}.shell{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 20px calc(100px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 0 28px}.brand{font-size:21px;font-weight:650;letter-spacing:.5px}.brand span{color:#a2b6ef}.add{background:#fff;color:#12131a;border:0;width:42px;height:42px;border-radius:50%;font-size:30px;line-height:1}.sub{color:#aeb2c3}.hero{padding:19px 0 25px}.hero h1{font-size:28px;font-weight:700;margin:3px 0 13px;overflow-wrap:anywhere}.meta{font-size:13px;color:#c4c8d4;display:flex;flex-wrap:wrap;gap:8px 16px}.panel{background:#1e2230d9;border:1px solid #3a4155;border-radius:20px;padding:20px;margin-top:12px;box-shadow:0 8px 30px #0002}.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{background:#262c3d;border-radius:13px;padding:13px 9px}.stat small{font-size:11px;color:#b8bfd0}.stat strong{display:block;font-size:23px;margin-top:7px;font-variant-numeric:tabular-nums}.label{font-size:14px;font-weight:650;margin:3px 0 13px}.pace{text-align:center;padding:22px 0 12px}.pace p{margin:0 0 4px;color:#c9cbd4;font-size:14px}.pace strong{font-size:58px;font-weight:780;font-variant-numeric:tabular-nums}.pace small{font-size:20px}.hint{font-size:12px;color:#b7bbcb;text-align:center;margin-top:10px}.graphwrap{width:100%;aspect-ratio:1.55;min-height:180px}.graphwrap svg{width:100%;height:100%;overflow:visible}.entry{display:flex;gap:10px;align-items:center}.entry input{width:100%;min-width:0;text-align:center;font-size:28px;font-weight:650;padding:13px;border-radius:12px;color:#fff;background:#161925;border:1px solid #626b80}.primary{background:#dce5ff;color:#11182c;border:none;border-radius:12px;padding:15px 20px;font-weight:750;white-space:nowrap}.secondary{background:#2c3448;color:#e6ebf9;border:1px solid #505a72;border-radius:12px;padding:11px 13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.history{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #384154;padding:10px 2px;font-size:14px}.history:last-child{border-bottom:0}.empty{text-align:center;color:#cdd0da;padding:70px 20px}.empty h2{color:white}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.tab{border:1px solid #475068;border-radius:24px;padding:10px 14px;background:#202537;color:#f4f6ff;white-space:nowrap;max-width:245px;overflow:hidden;text-overflow:ellipsis}.tab.active{background:#dce5ff;color:#111827;border-color:#dce5ff}.modalwrap{position:fixed;inset:0;background:#05060bd6;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.modal{background:#222737;border:1px solid #515a72;border-radius:20px;padding:22px;width:min(100%,470px);max-height:94dvh;overflow:auto}.modal h2{margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-size:13px;margin-bottom:8px;color:#d4d8e6}.field input{width:100%;padding:13px;background:#121621;color:#fff;border:1px solid #69728b;border-radius:10px;color-scheme:dark}.modalfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.danger{color:#ffbcbc}.error{color:#ffbcbc;font-size:13px;min-height:18px}.foot{text-align:center;color:#898fa3;font-size:12px;margin:22px 0}.hidden{display:none!important}@media(max-width:390px){.shell{padding-left:14px;padding-right:14px}.stat strong{font-size:20px}.meta{font-size:12px}.pace strong{font-size:50px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">✦ Study<span>Pace</span></div><button class="add" id="addBtn" aria-label="問題集を追加">＋</button></header><div id="app"></div><div class="foot">無料・広告なし・記録はこのブラウザ内に保存</div></main><div id="modalRoot"></div><script>
(()=>{'use strict';const KEY='study-pace-v1';let state={books:[],selected:null};const $=s=>document.querySelector(s);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const localToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const dateNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)};const fmtDate=s=>s.replace(/-/g,'/');const sum=b=>Object.values(b.logs||{}).reduce((a,n)=>a+n,0);const remain=b=>Math.max(0,b.total-sum(b));const remainingDays=b=>Math.max(0,dateNum(b.end)-Math.max(dateNum(b.start),dateNum(localToday()))+1);const pace=b=>remainingDays(b)>0?Math.ceil(remain(b)/remainingDays(b)):null;const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('保存できません:',e)}};try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.books))state=v}catch(_){}function book(){return state.books.find(x=>x.id===state.selected)||state.books[0]}function select(id){state.selected=id;persist();render()}
function graph(b){let start=dateNum(b.start),end=dateNum(b.end);if(end<=start)end=start+1;const today=dateNum(localToday());const left=remain(b),done=sum(b),W=600,H=305,L=52,R=16,T=18,B=45;const x=day=>L+(day-start)/(end-start)*(W-L-R),y=n=>T+(b.total-n)/Math.max(1,b.total)*(H-T-B);let points=[{date:b.start,remaining:b.total}];let s=b.total;Object.entries(b.logs).sort((a,z)=>a[0].localeCompare(z[0])).forEach(([d,n])=>{s-=n;points.push({date:d,remaining:Math.max(0,s)})});let actual=points.filter(p=>dateNum(p.date)>=start&&dateNum(p.date)<=end).map(p=>`${x(dateNum(p.date))},${y(p.remaining)}`).join(' ');let tick='';for(let i=0;i<=4;i++){const val=Math.round(b.total*i/4);tick+=`<text x="${L-9}" y="${y(val)+4}" text-anchor="end" font-size="12" fill="#adb4c5">${val.toLocaleString()}</text><line x1="${L}" x2="${W-R}" y1="${y(val)}" y2="${y(val)}" stroke="#515a70" stroke-opacity=".35"/>`;}let todayX=x(Math.min(end,Math.max(start,today)));return `<div class="graphwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="残り問題数の推移。点線は理想ペース、実線は実績"><title>残り問題数の推移</title>${tick}<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#a8aec0"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#a8aec0"/><line x1="${L}" y1="${y(b.total)}" x2="${W-R}" y2="${y(0)}" stroke="#b6bbce" stroke-dasharray="7 7" stroke-width="2.5"/><polyline points="${actual}" fill="none" stroke="#9dd9ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${todayX}" cy="${y(left)}" r="5" fill="#a6dbff" opacity="${today>=start&&today<=end?1:0}"/><text x="${L}" y="${H-14}" fill="#b9bfd1" font-size="13" text-anchor="start">${fmtDate(b.start)}</text><text x="${W-R}" y="${H-14}" fill="#b9bfd1" font-size="13" text-anchor="end">${fmtDate(b.end)}</text></svg></div>`}
function render(){if(!state.books.length){$('#app').innerHTML=`<div class="empty"><div style="font-size:52px">📚</div><h2>最初の問題集を登録</h2><p>総問題数と期限を設定するだけで<br>今日必要な問題数を自動計算します。</p><button class="primary" id="emptyAdd">問題集を追加する</button></div>`;$('#emptyAdd').onclick=()=>showForm();return}let b=book();state.selected=b.id;const done=sum(b),left=remain(b),days=remainingDays(b),p=pace(b),isOver=dateNum(localToday())>dateNum(b.end);const tabs=state.books.map(x=>`<button class="tab ${x.id===b.id?'active':''}" data-id="${escape(x.id)}">${escape(x.name)}</button>`).join('');const history=Object.entries(b.logs).sort((a,z)=>z[0].localeCompare(a[0])).slice(0,12).map(([d,n])=>`<div class="history"><span>${fmtDate(d)}</span><span>＋${n.toLocaleString()} 問</span></div>`).join('')||'<div class="sub" style="font-size:13px">まだ記録がありません。</div>';$('#app').innerHTML=`<nav class="tabs">${tabs}</nav><section class="hero"><h1>${escape(b.name)}</h1><div class="meta"><span>▦ ${fmtDate(b.start)} ～ ${fmtDate(b.end)}</span><span>⚑ ${b.total.toLocaleString()} 問</span></div></section><div class="statrow"><div class="stat"><small>完了</small><strong>${done.toLocaleString()}</strong></div><div class="stat"><small>残り</small><strong>${left.toLocaleString()}</strong></div><div class="stat"><small>残り日数</small><strong>${days}</strong></div></div><section class="panel"><div class="label">残り問題数のグラフ</div>${graph(b)}<div class="pace"><p>${left===0?'完了しました！':isOver?'期限を過ぎています': '期限までに終わらせるためには'}</p><strong>${left===0?'0':p===null?'—':p}</strong> <small>問 / 日</small></div><div class="hint">${left===0?'お疲れさまでした！':isOver?'終了日を変更すると必要ノルマを再計算します':`本日を含めてあと${days}日です。記録すると自動更新されます。`}</div></section><section class="panel"><div class="label">今日解いた問題数を記録</div><div class="entry"><input id="countInput" type="number" min="1" max="${left}" placeholder="例：20" inputmode="numeric" aria-label="今日解いた問題数"><button class="primary" id="recordBtn" ${left===0?'disabled':''}>記録する</button></div><p class="error" id="entryError"></p><div class="hint">同じ日に複数回記録できます。記録内容は合算されます。</div></section><section class="panel"><div class="label">最近の記録</div>${history}<div class="actions" style="margin-top:16px"><button class="secondary" id="undoBtn" ${!Object.keys(b.logs).length?'disabled':''}>直近の記録を取り消す</button><button class="secondary" id="editBtn">問題集を編集</button><button class="secondary" id="exportBtn">バックアップ</button><button class="secondary" id="importBtn">復元</button></div></section>`;document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>select(el.dataset.id));$('#recordBtn').onclick=()=>{const n=Number($('#countInput').value);if(!Number.isSafeInteger(n)||n<1||n>remain(b)){ $('#entryError').textContent=`1〜${remain(b)}問の整数を入力してください。`;return}const d=localToday();b.logs[d]=(b.logs[d]||0)+n;b.events=b.events||[];b.events.push({date:d,count:n});persist();render()};$('#editBtn').onclick=()=>showForm(b);$('#undoBtn').onclick=()=>{if(!confirm('最後の記録を取り消しますか？'))return;const ev=b.events?.pop();if(ev){b.logs[ev.date]-=ev.count;if(b.logs[ev.date]===0)delete b.logs[ev.date]}else{let dates=Object.keys(b.logs).sort();delete b.logs[dates[dates.length-1]]}persist();render()};$('#exportBtn').onclick=backup;$('#importBtn').onclick=restore;}
function showForm(b){const editing=!!b;const today=localToday();let end=new Date();end.setDate(end.getDate()+30);const defaultEnd=end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');$('#modalRoot').innerHTML=`<div class="modalwrap"><form class="modal" id="bookForm"><h2>${editing?'問題集を編集':'新しい問題集'}</h2><div class="field"><label for="name">問題集の名前</label><input id="name" maxlength="100" required placeholder="例：UWorld Step 1" value="${editing?escape(b.name):''}"></div><div class="field"><label for="total">総問題数</label><input id="total" type="number" min="1" max="10000000" step="1" required inputmode="numeric" value="${editing?b.total:''}"></div><div class="field"><label for="start">開始日</label><input id="start" type="date" required value="${editing?b.start:today}"></div><div class="field"><label for="end">終了日</label><input id="end" type="date" required value="${editing?b.end:defaultEnd}"></div><div class="error" id="formError"></div><div class="modalfoot">${editing?'<button class="secondary danger" type="button" id="deleteBtn">削除</button>':''}<button class="secondary" type="button" id="cancelBtn">キャンセル</button><button class="primary" type="submit">保存する</button></div></form></div>`;$('#cancelBtn').onclick=close;$('#modalRoot .modalwrap').onclick=e=>{if(e.target.classList.contains('modalwrap'))close()};$('#bookForm').onsubmit=e=>{e.preventDefault();const name=$('#name').value.trim(),total=Number($('#total').value),start=$('#start').value,end=$('#end').value;if(!name||!Number.isSafeInteger(total)||total<1||total>10000000||!start||!end||dateNum(end)<dateNum(start)||editing&&total<sum(b)){$('#formError').textContent='入力内容を確認してください。終了日は開始日以降、総問題数は完了数以上にしてください。';return}if(editing){Object.assign(b,{name,total,start,end})}else{b={id:(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2)),name,total,start,end,logs:{},events:[]};state.books.push(b)}state.selected=b.id;persist();close();render()};if(editing)$('#deleteBtn').onclick=()=>{if(!confirm('「'+b.name+'」と記録をすべて削除しますか？'))return;state.books=state.books.filter(x=>x.id!==b.id);state.selected=state.books[0]?.id||null;persist();close();render()};$('#name').focus()}
function close(){$('#modalRoot').innerHTML=''}function backup(){const blob=new Blob([JSON.stringify({version:1,books:state.books},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='study-pace-backup-'+localToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!Array.isArray(d.books)||d.books.length>1000||!d.books.every(b=>typeof b.name==='string'&&b.name.length<=100&&Number.isSafeInteger(b.total)&&b.total>0&&b.total<=10000000&&/^\d{4}-\d{2}-\d{2}$/.test(b.start)&&/^\d{4}-\d{2}-\d{2}$/.test(b.end)&&b.logs&&typeof b.logs==='object'&&Object.entries(b.logs).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isSafeInteger(v)&&v>=0)&&sum(b)<=b.total))throw Error('invalid');if(!confirm('現在の記録をバックアップデータで置き換えますか？'))return;state={books:d.books,selected:d.books[0]?.id||null};persist();render()}catch(_){alert('バックアップファイルを読み込めませんでした。')}};f.click()}
$('#addBtn').addEventListener('click',()=>showForm());render();if('serviceWorker'in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
